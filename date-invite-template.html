<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f3">
  <title>A little date idea</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #322a35;
      --muted: #786d78;
      --pink: #d94e78;
      --pink-dark: #bd3e66;
      --paper: #fffdfb;
      --line: #f0e5e5;
      --soft: #fff1f3;
      --green: #287957;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: radial-gradient(ellipse at 15% 10%, #ffe5eb 0, transparent 36%),
                  radial-gradient(ellipse at 90% 90%, #ffe9d9 0, transparent 38%), #fff8f3;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .card {
      width: min(100%, 620px);
      min-height: 440px;
      padding: clamp(24px, 6vw, 46px);
      overflow: hidden;
      border: 1px solid #fff;
      border-radius: 28px;
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      box-shadow: 0 24px 80px #70404a1c;
    }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { color: var(--pink-dark); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .step-label { color: var(--muted); font-size: 13px; }
    .progress { height: 7px; margin: 18px 0 30px; overflow: hidden; border-radius: 99px; background: #f5e9e9; }
    .progress > div { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f49aaa, var(--pink)); transition: width .3s ease; }
    .hero-icon { margin: 8px 0 14px; font-size: 48px; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 42px); line-height: 1.12; letter-spacing: -.04em; }
    h2 { margin: 0; font-size: clamp(23px, 5vw, 32px); line-height: 1.2; letter-spacing: -.025em; }
    .sub { max-width: 440px; margin: 13px auto 0; color: var(--muted); }
    .center { text-align: center; }
    .invite-area { position: relative; display: flex; min-height: 100px; justify-content: center; align-items: center; gap: 12px; margin-top: 24px; }
    .btn {
      min-height: 48px; padding: 12px 20px; border: 0; border-radius: 14px;
      cursor: pointer; font-weight: 750; transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .btn:focus-visible, .choice:focus-visible { outline: 3px solid #3835a3; outline-offset: 3px; }
    .btn:hover { transform: translateY(-1px); }
    .primary { color: white; background: var(--pink); box-shadow: 0 8px 18px #d94e7833; }
    .primary:hover { background: var(--pink-dark); }
    .secondary { color: var(--ink); background: #f5eeee; }
    #noBtn { z-index: 2; }
    .note { min-height: 24px; margin-top: 14px; color: var(--green); font-weight: 650; }
    .question { margin-bottom: 9px; }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
    .choice {
      min-height: 82px; padding: 15px; border: 1px solid var(--line); border-radius: 17px;
      color: var(--ink); background: white; text-align: left; cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .choice:hover { transform: translateY(-2px); border-color: #ed9aad; }
    .choice.selected { border: 2px solid var(--pink); background: var(--soft); }
    .choice .emoji { display: block; margin-bottom: 7px; font-size: 25px; }
    .choice .name { display: block; font-weight: 750; }
    .choice .detail { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 26px; }
    .nav-right { display: flex; gap: 10px; margin-left: auto; }
    .text-btn { padding: 10px 12px; border: 0; color: var(--muted); background: transparent; cursor: pointer; font-weight: 650; }
    .recap { display: grid; gap: 9px; margin: 24px 0; padding: 18px; border-radius: 18px; background: #fff3f4; }
    .recap-row { display: flex; justify-content: space-between; gap: 16px; padding-bottom: 8px; border-bottom: 1px solid #f2dfe3; }
    .recap-row:last-child { padding-bottom: 0; border: 0; }
    .recap-row span:first-child { color: var(--muted); }
    .recap-row strong { text-align: right; }
    .footer-note { margin-top: 20px; color: #887d84; font-size: 12px; text-align: center; }
    .hidden { display: none !important; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .card { min-height: 0; padding: 24px 19px; border-radius: 22px; }
      .choices { grid-template-columns: 1fr; gap: 9px; }
      .choice { min-height: 68px; }
      .recap-row { flex-direction: column; gap: 2px; }
      .recap-row strong { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="topline">
      <span class="brand">A little invitation</span>
      <span class="step-label" id="stepLabel"></span>
    </div>
    <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

    <section id="inviteScreen" class="center">
      <div class="hero-icon" aria-hidden="true">💌</div>
      <h1 id="inviteTitle">Would you like to go on a date with me?</h1>
      <p class="sub">I have a few fun ideas. You can say yes or no—whatever feels right 😊</p>
      <div class="invite-area" id="inviteArea">
        <button class="btn primary" id="yesBtn">Yes, let’s plan! 💖</button>
        <button class="btn secondary" id="noBtn">No thanks</button>
      </div>
      <div class="note" id="inviteNote" role="status"></div>
      <p class="footer-note">The “No” button has a playful dodge—but it will stop after a few tries.</p>
    </section>

    <section id="plannerScreen" class="hidden">
      <div class="hero-icon" id="stepEmoji" aria-hidden="true">🍽️</div>
      <h2 class="question" id="stepTitle"></h2>
      <p class="sub" id="stepSubtitle"></p>
      <div class="choices" id="choices"></div>
      <div class="nav">
        <button class="text-btn" id="backBtn">← Back</button>
        <div class="nav-right">
          <button class="btn secondary" id="skipBtn">Skip</button>
          <button class="btn primary" id="nextBtn">Next →</button>
        </div>
      </div>
    </section>

    <section id="recapScreen" class="hidden center">
      <div class="hero-icon" aria-hidden="true">✨</div>
      <h2>Our date idea</h2>
      <p class="sub">Here’s the plan we picked. We can still change anything.</p>
      <div class="recap" id="recap"></div>
      <div class="nav">
        <button class="text-btn" id="editBtn">← Edit choices</button>
        <div class="nav-right">
          <button class="btn secondary" id="copyBtn">Copy plan</button>
          <button class="btn primary" id="restartBtn">Start again</button>
        </div>
      </div>
      <div class="note" id="recapNote" role="status"></div>
    </section>
  </main>

  <script>
    // Customize the invite text and the choices below.
    const inviteText = "Would you like to go on a date with me?";
    const steps = [
      { key: "activity", emoji: "🎡", title: "What should we do?", subtitle: "Pick the kind of outing that sounds fun.", options: [
        ["🎬", "Movie night", "A cozy film and snacks"], ["🌳", "Park stroll", "Fresh air and a relaxed walk"], ["🎮", "Arcade", "Games, laughs, and friendly competition"], ["🖼️", "Explore", "A museum, market, or somewhere new"]
      ]},
      { key: "food", emoji: "🍜", title: "What should we eat?", subtitle: "Every good date needs something tasty.", options: [
        ["🍕", "Pizza", "Classic and easy"], ["🍣", "Sushi", "A little bit of everything"], ["🌮", "Tacos", "Casual and delicious"], ["☕", "Coffee & dessert", "A sweet, low-key date"]
      ]},
      { key: "when", emoji: "📅", title: "When works for you?", subtitle: "Choose a time that feels comfortable.", options: [
        ["☀️", "Weekend afternoon", "No rush, plenty of daylight"], ["🌆", "Friday evening", "Start the weekend together"], ["🗓️", "Pick a day together", "We can decide later"], ["💬", "Ask me first", "Let’s check our calendars"]
      ]},
      { key: "vibe", emoji: "👟", title: "What’s the vibe?", subtitle: "No dress code—just what feels like you.", options: [
        ["🧸", "Cozy casual", "Comfort comes first"], ["✨", "Dress up a little", "Make it feel special"], ["🌿", "Whatever feels right", "We’ll keep it easy"], ["🎨", "Surprise me", "I’m open to ideas"]
      ]},
      { key: "dessert", emoji: "🍦", title: "Save room for dessert?", subtitle: "Optional, but there are good choices.", options: [
        ["🍦", "Ice cream", "A classic treat"], ["🍰", "Cake", "One slice to share—or two"], ["🧋", "Boba", "A drink and a walk"], ["🌟", "Let’s see later", "No pressure"]
      ]},
      { key: "music", emoji: "🎶", title: "One last detail: music?", subtitle: "For the drive, the walk, or wherever we end up.", options: [
        ["🎧", "Share playlists", "A little music swap"], ["🎤", "Sing-along", "Bad singing encouraged"], ["🌙", "Keep it quiet", "Let’s just talk"], ["🎲", "You choose", "I’m easy"]
      ]}
    ];

    const answers = {};
    let current = 0;
    let dodges = 0;
    const $ = (selector) => document.querySelector(selector);
    const inviteScreen = $("#inviteScreen");
    const plannerScreen = $("#plannerScreen");
    const recapScreen = $("#recapScreen");
    $("#inviteTitle").textContent = inviteText;

    function showScreen(screen) {
      [inviteScreen, plannerScreen, recapScreen].forEach((item) => item.classList.add("hidden"));
      screen.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateProgress() {
      const percent = current === steps.length ? 100 : Math.round((current / steps.length) * 100);
      $("#progressBar").style.width = `${percent}%`;
      $("#stepLabel").textContent = current === 0 ? "" : current === steps.length ? "Plan ready" : `Step ${current} of ${steps.length}`;
    }

    function renderStep() {
      const step = steps[current];
      $("#stepEmoji").textContent = step.emoji;
      $("#stepTitle").textContent = step.title;
      $("#stepSubtitle").textContent = step.subtitle;
      $("#choices").replaceChildren(...step.options.map(([emoji, name, detail]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice" + (answers[step.key] === name ? " selected" : "");
        button.setAttribute("aria-pressed", answers[step.key] === name ? "true" : "false");
        button.innerHTML = `<span class="emoji">${emoji}</span><span class="name"></span><span class="detail"></span>`;
        button.querySelector(".name").textContent = name;
        button.querySelector(".detail").textContent = detail;
        button.addEventListener("click", () => {
          answers[step.key] = name;
          renderStep();
        });
        return button;
      }));
      $("#backBtn").classList.toggle("hidden", current === 0);
      $("#nextBtn").textContent = current === steps.length - 1 ? "See our plan ✨" : "Next →";
      updateProgress();
    }

    function renderRecap() {
      const labels = { activity: "Activity", food: "Food", when: "When", vibe: "Vibe", dessert: "Dessert", music: "Music" };
      $("#recap").replaceChildren(...steps.map((step) => {
        const row = document.createElement("div");
        row.className = "recap-row";
        const label = document.createElement("span");
        const value = document.createElement("strong");
        label.textContent = labels[step.key];
        value.textContent = answers[step.key] || "We’ll decide together";
        row.append(label, value);
        return row;
      }));
      current = steps.length;
      updateProgress();
    }

    function moveNoButton(event) {
      if (dodges >= 4) return;
      // On touch screens, move on the first tap; later taps can select No.
      if (event && event.pointerType === "touch" && dodges > 0) return;
      const area = $("#inviteArea");
      const maxX = Math.max(0, area.clientWidth - $("#noBtn").offsetWidth);
      const maxY = Math.max(0, area.clientHeight - $("#noBtn").offsetHeight);
      $("#noBtn").style.position = "absolute";
      $("#noBtn").style.left = `${Math.random() * maxX}px`;
      $("#noBtn").style.top = `${Math.random() * maxY}px`;
      dodges++;
      if (dodges === 4) $("#inviteNote").textContent = "Okay, no more dodging. Your answer is yours 💚";
    }

    $("#noBtn").addEventListener("pointerenter", moveNoButton);
    $("#noBtn").addEventListener("pointerdown", (event) => {
      if (event.pointerType === "touch" && dodges < 4) {
        event.preventDefault();
        moveNoButton(event);
      }
    });
    $("#noBtn").addEventListener("click", () => {
      if (dodges < 4) return;
      $("#inviteNote").textContent = "No worries—thanks for letting me know 💚";
    });
    $("#yesBtn").addEventListener("click", () => {
      current = 0;
      renderStep();
      showScreen(plannerScreen);
    });
    $("#backBtn").addEventListener("click", () => {
      if (current > 0) current--;
      renderStep();
    });
    $("#nextBtn").addEventListener("click", () => {
      if (current < steps.length - 1) {
        current++;
        renderStep();
      } else {
        renderRecap();
        showScreen(recapScreen);
      }
    });
    $("#skipBtn").addEventListener("click", () => {
      current = Math.min(current + 1, steps.length - 1);
      renderStep();
    });
    $("#editBtn").addEventListener("click", () => {
      current = 0;
      renderStep();
      showScreen(plannerScreen);
    });
    $("#restartBtn").addEventListener("click", () => {
      Object.keys(answers).forEach((key) => delete answers[key]);
      current = 0;
      $("#recapNote").textContent = "";
      $("#inviteNote").textContent = "";
      $("#noBtn").style.cssText = "";
      dodges = 0;
      updateProgress();
      showScreen(inviteScreen);
    });
    $("#copyBtn").addEventListener("click", async () => {
      const summary = steps.map((step) => `${step.title} ${answers[step.key] || "We’ll decide together"}`).join("\n");
      try {
        await navigator.clipboard.writeText(`Our date idea 💌\n${summary}`);
        $("#recapNote").textContent = "Plan copied!";
      } catch {
        $("#recapNote").textContent = "Copy isn’t available here—select the choices above to share them.";
      }
    });
    updateProgress();
  </script>
</body>
</html>
